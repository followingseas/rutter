name: Followingseas Rutter
version: 2.0.0
scope: organization
type: application

docs:
  conventions: docs/conventions
  maps: docs/maps
policies: policies
defaults: defaults.yaml

repositories:
  - id: wake
    remote: https://github.com/followingseas/wake
  - id: pilot
    remote: https://github.com/followingseas/pilot

values:
  merge:
    overrides:
      - path: /policies/rules
        strategy: uniqueBy:id
  lockedFields:
    - /security/signing/required

adapters:
  claude:
    enabled: true
  codex:
    enabled: true
  copilot:
    enabled: true
